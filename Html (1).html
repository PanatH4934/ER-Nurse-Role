<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบจัดตารางเวร ER - รพ.นพรัตนราชธานี</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Sarabun',sans-serif;background:linear-gradient(160deg,#fff1f5,#fdf2f8 40%,#fff7fb)}
  .tab-on{background:#db2777;color:#fff}
  .sticky-l{position:sticky;left:0;z-index:5;background:#fff}
  .ovwrap{overflow:auto;max-height:72vh;-webkit-overflow-scrolling:touch}
  .ovwrap th{position:sticky;top:0;z-index:6;background:#fce7f3}
  .chip{display:inline-block;min-width:22px;text-align:center;border-radius:4px;padding:1px 3px;font-size:10px;font-weight:700;margin:1px}
  .navy{background:#1e3a8a;color:#fff}
  @media print { body{background:#fff} #tabs,.no-print,#hdr{display:none !important} #view{border:none;box-shadow:none} }
</style>
</head>
<body class="min-h-screen">

<div id="toast" class="hidden"></div>

<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-xl p-8 w-full max-w-sm text-center border border-pink-100">
    <div class="text-5xl mb-3">🏥</div>
    <h1 class="text-2xl font-bold text-pink-700">ระบบจัดตารางเวร ER</h1>
    <p class="text-slate-500 text-sm mb-6">รพ.นพรัตนราชธานี</p>
    <input id="pin" type="password" placeholder="รหัสเข้าใช้งาน"
      class="w-full border border-pink-200 rounded-xl px-4 py-3 text-center tracking-widest mb-3">
    <button onclick="doLogin()" class="w-full bg-pink-600 text-white rounded-xl py-3 font-semibold">เข้าสู่ระบบ</button>
    <p id="err" class="text-rose-500 text-sm mt-3 min-h-[20px]"></p>
  </div>
</div>

<div id="app" class="hidden max-w-7xl mx-auto p-3 md:p-5">
  <div id="hdr" class="bg-white rounded-2xl shadow p-4 flex items-center justify-between mb-4 flex-wrap gap-2 border border-pink-100">
    <div>
      <h1 class="font-bold text-lg text-pink-700">🏥 ระบบจัดตารางเวร ER</h1>
      <p class="text-xs text-slate-500">รพ.นพรัตนราชธานี</p>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <span id="whoBox"></span>
      <span id="badge" class="text-xs px-2 py-1 rounded-full"></span>
      <button onclick="location.reload()" class="text-slate-400 text-xl px-1">⏻</button>
    </div>
  </div>
  <div id="tabs" class="flex gap-2 mb-4 flex-wrap no-print"></div>
  <div id="view" class="bg-white rounded-2xl shadow p-4 md:p-6 border border-pink-100"></div>
</div>

<script>
/* ================= STORAGE ================= */
var MEM={};
var store={
  get:function(k){ try{return localStorage.getItem(k);}catch(e){return MEM[k]||null;} },
  set:function(k,v){ try{localStorage.setItem(k,v);}catch(e){MEM[k]=v;} }
};
function toast(msg,bad){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.className='fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl shadow-lg text-sm font-semibold '+(bad?'bg-rose-600 text-white':'bg-pink-600 text-white');
  setTimeout(function(){ t.className='hidden'; },2800);
}

/* ================= CONFIG ================= */
var PIN_ADMIN='80106', PIN_MN='MN', PIN_MEMBER='1234';

var POS=[
 {c:'MN',l:'หัวหน้าเวร',               chip:'navy',                          dot:'#1e3a8a', bgc:'bg-blue-900 text-white'},
 {c:'LAN',l:'หัวหน้าทีมห้องสังเกตอาการ', chip:'bg-indigo-600 text-white',      dot:'#4f46e5', bgc:'bg-indigo-600 text-white'},
 {c:'MAN',l:'สมาชิกห้องสังเกตอาการ',    chip:'bg-indigo-200 text-indigo-900', dot:'#a5b4fc', bgc:'bg-indigo-500 text-white'},
 {c:'EMS',l:'ปฏิบัติงานที่กู้ชีพ',       chip:'bg-cyan-600 text-white',        dot:'#0891b2', bgc:'bg-cyan-600 text-white'},
 {c:'LR',l:'หัวหน้าทีม Resus',        chip:'bg-red-600 text-white',         dot:'#dc2626', bgc:'bg-red-600 text-white'},
 {c:'MR',l:'ลูกทีม Resus',             chip:'bg-red-200 text-red-800',       dot:'#fca5a5', bgc:'bg-red-500 text-white'},
 {c:'LU',l:'หัวหน้าทีม Urgent',       chip:'bg-yellow-400 text-yellow-900', dot:'#facc15', bgc:'bg-amber-500 text-white'},
 {c:'MU',l:'ลูกทีม Urgent',            chip:'bg-yellow-200 text-yellow-800', dot:'#fde047', bgc:'bg-amber-400 text-amber-950'},
 {c:'SU',l:'โซนทำแผล',                 chip:'bg-emerald-500 text-white',     dot:'#10b981', bgc:'bg-emerald-600 text-white'},
 {c:'T', l:'คัดกรอง',                   chip:'bg-orange-500 text-white',      dot:'#f97316', bgc:'bg-orange-500 text-white'},
 {c:'Vac',l:'พักร้อน',                 chip:'bg-sky-500 text-white',         dot:'#0284c7', bgc:'bg-sky-600 text-white'},
 {c:'น',  l:'ออกหน่วย',                 chip:'bg-purple-500 text-white',      dot:'#a855f7', bgc:'bg-purple-600 text-white'},
 {c:'อ',  l:'อบรม/ไปราชการ',           chip:'bg-teal-500 text-white',        dot:'#0d9488', bgc:'bg-teal-600 text-white'}
];
var SHIFT=[
 {c:'M',l:'เช้า',ab:'ช',t:'08.01-16.00',icon:'🌅',bg:'bg-rose-50',   bd:'border-rose-200',   tx:'text-rose-700'},
 {c:'A',l:'บ่าย',ab:'บ',t:'16.01-23.59',icon:'🌆',bg:'bg-fuchsia-50',bd:'border-fuchsia-200',tx:'text-fuchsia-700'},
 {c:'N',l:'ดึก', ab:'ด',t:'00.01-08.00',icon:'🌙',bg:'bg-pink-50',   bd:'border-pink-200',   tx:'text-pink-800'}
];
var TH_M=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var TH_D=['อา','จ','อ','พ','พฤ','ศ','ส'];

function pad(n){ return n<10?'0'+n:''+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function thDate(s){ var p=s.split('-'); return (+p[2])+' '+TH_M[(+p[1])-1]+' '+((+p[0])+543); }
function nameOf(id){ for(var i=0;i<DB.staff.length;i++) if(DB.staff[i].id===id) return DB.staff[i].name; return '-'; }
function staffOf(id){ for(var i=0;i<DB.staff.length;i++) if(DB.staff[i].id===id) return DB.staff[i]; return null; }
function posOf(c){ for(var i=0;i<POS.length;i++) if(POS[i].c===c) return POS[i]; return null; }
function shOf(c){ for(var i=0;i<SHIFT.length;i++) if(SHIFT[i].c===c) return SHIFT[i]; return SHIFT[0]; }

/* ================= DATA ================= */
function seed(){
  var names=['สมหญิง','วราภรณ์','ปิยะดา','ณัฐชา','กมลวรรณ','ศิริพร','อรอนงค์','ธนพร','พิมพ์ชนก','รัตนา',
             'สุนิสา','จารุวรรณ','เบญจมาศ','อารียา','ชุติมา','นภัสสร','ดวงใจ','กานต์ธิดา','มณีรัตน์','ภัทรวดี',
             'สุภาวดี','ทิพย์สุดา','เกศริน','วิไลวรรณ','อัจฉรา'];
  var staff=[];
  var allCaps=POS.map(function(p){ return p.c; });
  for(var i=0;i<names.length;i++){
    staff.push({id:i+1,name:names[i],level:'RN',caps:allCaps});
  }
  var db={staff:staff, assign:{}, roles:{}, notes:{}, otype:{}, logs:[], missions:[]};
  var base=new Date(), y=base.getFullYear(), m=base.getMonth();
  for(var mo=m-1; mo<=m+1; mo++){
    var last=new Date(y,mo+1,0).getDate();
    for(var d=1; d<=last; d++){
      var key=ymd(new Date(y,mo,d));
      db.assign[key]={M:[],A:[],N:[]};
      var pool=staff.slice().sort(function(){return Math.random()-0.5;});
      for(var s=0;s<SHIFT.length;s++){
        var arr=[];
        for(var k=0;k<8;k++){ var p=pool.pop(); if(p) arr.push(p.id); }
        db.assign[key][SHIFT[s].c]=arr;
      }
    }
  }
  return db;
}
var DB;
try{ DB=JSON.parse(store.get('erdbv11'))||seed(); }catch(e){ DB=seed(); }
if(!DB||!DB.staff) DB=seed();
if(!DB.roles) DB.roles={};
if(!DB.notes) DB.notes={};
if(!DB.otype) DB.otype={};
if(!DB.logs) DB.logs=[];
if(!DB.missions) DB.missions=[];
function save(){ store.set('erdbv11',JSON.stringify(DB)); }
save();

function listOf(date,sc){ return ((DB.assign[date]||{})[sc]||[]); }
function roleOf(date,sc,id){ return ((DB.roles[date]||{})[sc]||{})[id]||''; }
function setRole(sc,id,val){
  if(!DB.roles[SEL]) DB.roles[SEL]={};
  if(!DB.roles[SEL][sc]) DB.roles[SEL][sc]={};
  if(val) DB.roles[SEL][sc][id]=val; else delete DB.roles[SEL][sc][id];
  save(); render();
}
function otOf(date,sc,id){ return ((DB.otype[date]||{})[sc]||{})[id]||'work'; }
function setOT(date,sc,id,val){
  if(!DB.otype[date]) DB.otype[date]={};
  if(!DB.otype[date][sc]) DB.otype[date][sc]={};
  DB.otype[date][sc][id]=val;
  save();
}
function noteOf(date,sc){ return ((DB.notes[date]||{})[sc])||''; }

/* ================= STATE ================= */
var ROLE='member', ME=null, TAB='power', CUR=new Date(), SEL=ymd(new Date()), VIEWID=null, MEMODE='person';

function doLogin(){
  var v=document.getElementById('pin').value.trim();
  if(v===PIN_ADMIN) ROLE='admin';
  else if(v.toUpperCase()===PIN_MN){
    ROLE='mn';
    TAB='daily';
  }
  else if(v===PIN_MEMBER) ROLE='member';
  else { document.getElementById('err').textContent='รหัสไม่ถูกต้อง'; return; }
  
  ME=DB.staff.length?DB.staff[0].id:null;
  VIEWID=ME;
  document.getElementById('login').className='hidden';
  document.getElementById('app').className='max-w-7xl mx-auto p-3 md:p-5';
  var b=document.getElementById('badge');
  b.textContent=(ROLE==='admin'?'ผู้ดูแลระบบ':(ROLE==='mn'?'หัวหน้าเวร':'สมาชิก'));
  b.className='text-xs px-2 py-1 rounded-full '+(ROLE==='admin'?'bg-amber-100 text-amber-700':(ROLE==='mn'?'navy px-2 py-1 rounded-full text-xs':'bg-pink-100 text-pink-700'));
  
  drawWho();
  render();
}
function drawWho(){
  var box = document.getElementById('whoBox');
  if(ROLE==='member'){
    var o='';
    for(var i=0;i<DB.staff.length;i++) o+='<option value="'+DB.staff[i].id+'"'+(DB.staff[i].id===ME?' selected':'')+'>'+DB.staff[i].name+'</option>';
    box.innerHTML = '<span class="text-xs text-slate-500 mr-1">ฉันคือ</span><select onchange="setMe(this.value)" class="border border-pink-200 rounded-lg px-2 py-1 text-sm">'+o+'</select>';
  } else {
    box.innerHTML = '';
  }
}
function setMe(v){ ME=+v; VIEWID=ME; render(); }
function canAssign(){ return ROLE==='admin'||ROLE==='mn'; }

function render(){
  var tabs = [];
  if(ROLE==='mn'){
    tabs = [['daily','🧩 ตำแหน่งรายวัน']];
    TAB = 'daily';
  } else {
    tabs=[['power','📊 อัตรากำลัง'],['daily','🧩 ตำแหน่งรายวัน'],['month','🗂 ตารางเวรรายเดือน'],['person','👤 ตารางเวรรายบุคคล']];
    if(ROLE!=='admin') tabs.push(['swap','🔄 แลกเวร']);
    tabs.push(['mission','🎯 ภารกิจพิเศษ']);
    tabs.push(['stat','📈 สถิติการขึ้นเวร']);
    if(ROLE==='admin') tabs.push(['staff','👥 จัดการบุคลากร']);
  }
  var h='';
  for(var i=0;i<tabs.length;i++)
    h+='<button onclick="switchTab(\''+tabs[i][0]+'\')" class="px-3 py-2 rounded-xl text-sm font-semibold '+(TAB===tabs[i][0]?'tab-on':'bg-white text-pink-700 shadow-sm border border-pink-100')+'">'+tabs[i][1]+'</button>';
  document.getElementById('tabs').innerHTML=h;
  var fn={power:vPower,daily:vDaily,month:vMonth,person:vPerson,swap:vSwap,mission:vMission,stat:vStat,staff:vStaff}[TAB];
  document.getElementById('view').innerHTML=fn();
}
function switchTab(t){ TAB=t; render(); }
function changeMonth(n){ CUR.setDate(1); CUR.setMonth(CUR.getMonth()+n); render(); }
function selectDay(d){ SEL=d; TAB='daily'; render(); }
function setSel(v){ SEL=v; render(); }
function monthNav(){
  return '<div class="flex items-center justify-center gap-4 mb-4 no-print">'+
    '<button onclick="changeMonth(-1)" class="px-3 py-1 bg-pink-100 text-pink-700 rounded-lg font-bold">◀</button>'+
    '<h2 class="font-bold text-lg text-pink-800">'+TH_M[CUR.getMonth()]+' '+(CUR.getFullYear()+543)+'</h2>'+
    '<button onclick="changeMonth(1)" class="px-3 py-1 bg-pink-100 text-pink-700 rounded-lg font-bold">▶</button></div>';
}
function legend(){
  var h='<div class="flex flex-wrap gap-2 mb-3 text-[11px]">';
  for(var i=0;i<POS.length;i++)
    h+='<span class="flex items-center gap-1"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:'+POS[i].dot+'"></span>'+POS[i].c+' '+POS[i].l+'</span>';
  return h+'</div>';
}

/* ============ 1. อัตรากำลัง ============ */
function vPower(){
  var y=CUR.getFullYear(), m=CUR.getMonth();
  var first=new Date(y,m,1).getDay(), last=new Date(y,m+1,0).getDate(), cells='';
  for(var i=0;i<first;i++) cells+='<div></div>';
  for(var d=1; d<=last; d++){
    var key=ymd(new Date(y,m,d)), bars='';
    for(var s=0;s<SHIFT.length;s++){
      var n=listOf(key,SHIFT[s].c).length;
      var warn=(n<12)?' ⚠':'';
      bars+='<div class="text-[11px] rounded px-1 my-0.5 '+SHIFT[s].bg+' '+SHIFT[s].tx+' font-semibold">'+SHIFT[s].ab+n+warn+'</div>';
    }
    var nt='';
    for(var q=0;q<SHIFT.length;q++) if(noteOf(key,SHIFT[q].c)) nt='<div class="text-[10px] text-amber-600">📝</div>';
    cells+='<div onclick="selectDay(\''+key+'\')" class="border border-pink-100 rounded-lg p-1 cursor-pointer hover:bg-pink-50 min-h-[80px]">'+
      '<div class="text-xs font-bold text-pink-700">'+d+'</div>'+bars+nt+'</div>';
  }
  var head=''; for(var k=0;k<7;k++) head+='<div>'+TH_D[k]+'</div>';
  return monthNav()+'<div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-pink-500 mb-1">'+head+'</div>'+
    '<div class="grid grid-cols-7 gap-1">'+cells+'</div>'+
    '<p class="text-xs text-slate-400 mt-3">ตัวเลข = จำนวนคนในผลัดนั้น · ⚠ = น้อยกว่า 12 คน · 📝 = มีหมายเหตุ · แตะวันเพื่อดูตำแหน่งรายวัน</p>';
}

/* ============ 2. ตำแหน่งรายวัน ============ */
function vDaily(){
  var cards='';
  for(var s=0;s<SHIFT.length;s++){
    var sh=SHIFT[s], arr=listOf(SEL,sh.c), rows='';
    var used={};
    for(var i=0;i<arr.length;i++){ var r0=roleOf(SEL,sh.c,arr[i]); if(r0) used[r0]=(used[r0]||0)+1; }
    for(var i=0;i<arr.length;i++){
      var id=arr[i], r=roleOf(SEL,sh.c,id), st=staffOf(id);
      if(!st) continue;
      var caps=st.caps||[];
      var cell='';
      if(canAssign()){
        var o='<option value="">— รอระบุตำแหน่ง —</option>';
        for(var p=0;p<POS.length;p++){
          var pc = POS[p].c;
          if(caps.indexOf(pc)<0) continue;
          if(pc==='LAN' && used['LAN'] && r!=='LAN') continue;
          if(pc==='MAN' && (used['MAN']||0)>=2 && r!=='MAN') continue;
          o+='<option value="'+pc+'"'+(r===pc?' selected':'')+'>'+pc+' · '+POS[p].l+'</option>';
        }
        cell='<select onchange="setRole(\''+sh.c+'\','+id+',this.value)" class="text-xs border border-pink-300 rounded-lg px-2 py-1 bg-white">'+o+'</select>';
      }else{
        cell = r ? '<span class="chip '+posOf(r).chip+'">'+r+'</span> <span class="text-xs text-slate-500">'+posOf(r).l+'</span>'
                 : '<span class="text-xs text-slate-400 italic">รอระบุตำแหน่ง</span>';
      }
      var ot=otOf(SEL,sh.c,id);
      var otTag = ot==='ot' ? '<span class="text-[10px] bg-violet-100 text-violet-700 px-1.5 py-0.5 rounded ml-1">OT</span>' : '';
      var remBtn = canAssign() ? '<button onclick="removeDailyStaff(\''+sh.c+'\','+id+')" class="text-rose-400 font-bold ml-1 px-1">✕</button>' : '';
      rows+='<div class="flex items-center justify-between gap-2 py-1.5 border-b border-pink-100 last:border-0">'+
        '<span class="text-sm '+(id===ME?'font-bold text-pink-700':'')+'">'+st.name+otTag+remBtn+'</span>'+cell+'</div>';
    }

    var addStaffHtml = '';
    if(canAssign()){
      var stOpts='<option value="">+ เพิ่มชื่อบุคลากรลงในเวรนี้</option>';
      for(var si=0; si<DB.staff.length; si++){
        if(arr.indexOf(DB.staff[si].id)<0){
          stOpts+='<option value="'+DB.staff[si].id+'">'+DB.staff[si].name+'</option>';
        }
      }
      addStaffHtml='<div class="mt-2 pt-2 border-t border-slate-200 flex gap-2">'+
        '<select id="add_st_'+sh.c+'" class="text-xs border border-pink-300 rounded-lg px-2 py-1 bg-white flex-1">'+stOpts+'</select>'+
        '<button onclick="addDailyStaff(\''+sh.c+'\')" class="bg-pink-600 text-white px-3 py-1 rounded-lg text-xs font-semibold">เพิ่ม</button></div>';
    }

    if(!arr.length && !addStaffHtml) rows='<p class="text-sm text-slate-400 py-2">ยังไม่มีคนขึ้นเวรผลัดนี้</p>';

    var miss='';
    for(var p2=0;p2<POS.length;p2++){
      var code2 = POS[p2].c;
      if((code2==='MN'||code2==='LAN'||code2==='LR'||code2==='LU'||code2==='T') && !used[code2]) miss+=code2+' ';
    }
    var note=noteOf(SEL,sh.c);
    var noteBox='<div class="mt-2 border border-amber-200 bg-amber-50 rounded-xl p-2">'+
      '<div class="text-xs font-bold text-amber-800 mb-1">📝 หมายเหตุเวร'+sh.l+'</div>'+
      (ROLE==='admin'
        ? '<textarea id="nt_'+sh.c+'" rows="2" class="w-full border border-amber-200 rounded-lg p-2 text-xs">'+note+'</textarea>'+
          '<button onclick="saveNote(\''+sh.c+'\')" class="mt-1 bg-amber-500 text-white px-3 py-1 rounded-lg text-xs font-semibold">บันทึก</button>'
        : (note?'<p class="text-xs whitespace-pre-wrap">'+note+'</p>':'<p class="text-xs text-slate-400">ไม่มีหมายเหตุ</p>'))+'</div>';

    cards+='<div class="border '+sh.bd+' '+sh.bg+' rounded-2xl p-4">'+
      '<div class="flex justify-between items-center"><h3 class="font-bold '+sh.tx+'">'+sh.icon+' '+sh.l+'</h3>'+
      '<span class="text-xs text-slate-500">'+sh.t+'</span></div>'+
      '<div class="flex justify-between items-center mt-1 mb-2"><span class="semibold '+sh.tx+'">รวม '+arr.length+' คน</span>'+
      (miss?'<span class="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">ยังขาด: '+miss+'</span>':'<span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">✓ ครบถ้วน</span>')+'</div>'+
      '<div class="bg-white/80 rounded-xl p-2">'+rows+addStaffHtml+'</div>'+noteBox+'</div>';
  }
  var tip = canAssign()
    ? '<span class="text-xs bg-blue-900 text-white px-2 py-1 rounded-full">คุณระบุและเพิ่มชื่อได้</span>'
    : '<span class="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded-full">โหมดอ่านอย่างเดียว</span>';
  return '<div class="flex items-center gap-3 mb-4 flex-wrap no-print">'+
    '<input type="date" value="'+SEL+'" onchange="setSel(this.value)" class="border border-pink-200 rounded-lg px-3 py-2">'+
    '<h2 class="font-bold text-pink-800">'+thDate(SEL)+'</h2>'+tip+'</div>'+
    legend()+'<div class="grid md:grid-cols-3 gap-4">'+cards+'</div>';

// ฟังก์ชันคลิกสลับเวรสด รองรับแถวปกติและแถว OT (รวม ชบ และ ดบ)
function adminCycleCell(dateStr, staffId, rowType){
  if(!DB.assign[dateStr]) DB.assign[dateStr]={M:[],A:[],N:[]};

  // ดึงสถานะปัจจุบันของคนนี้ในวันนี้
  var curShifts = [];
  ['M','A','N'].forEach(function(sc){
    if((DB.assign[dateStr][sc]||[]).indexOf(staffId)>=0){
      var ot = otOf(dateStr, sc, staffId);
      if((rowType==='ot' && ot==='ot') || (rowType==='work' && ot!=='ot')){
        curShifts.push(sc);
      }
    }
  });

  // ลบค่าเดิมในประเภทนั้นออกก่อน
  ['M','A','N'].forEach(function(sc){
    if(DB.assign[dateStr][sc]){
      DB.assign[dateStr][sc] = DB.assign[dateStr][sc].filter(function(x){ return x!==staffId; });
    }
    if(DB.otype[dateStr] && DB.otype[dateStr][sc]) delete DB.otype[dateStr][sc][staffId];
  });

  // ลำดับการวนสลับ
  var nextSet = [];
  if(rowType==='work'){
    if(curShifts.length===0) nextSet=['M'];
    else if(curShifts.indexOf('M')>=0) nextSet=['A'];
    else if(curShifts.indexOf('A')>=0) nextSet=['N'];
    else nextSet=[];
  } else {
    // แถว OT วน: ว่าง -> ช -> บ -> ด -> ชบ(M+A) -> ดบ(N+A) -> ว่าง
    if(curShifts.length===0) nextSet=['M'];
    else if(curShifts.length===1 && curShifts[0]==='M') nextSet=['A'];
    else if(curShifts.length===1 && curShifts[0]==='A') nextSet=['N'];
    else if(curShifts.length===1 && curShifts[0]==='N') nextSet=['M','A']; // ชบ
    else if(curShifts.length===2 && curShifts.indexOf('M')>=0) nextSet=['N','A']; // ดบ
    else nextSet=[];
  }

  if(nextSet.length>0){
    for(var i=0; i<nextSet.length; i++){
      var sc = nextSet[i];
      if(!DB.assign[dateStr][sc]) DB.assign[dateStr][sc]=[];
      DB.assign[dateStr][sc].push(staffId);
      setOT(dateStr, sc, staffId, (rowType==='ot'?'ot':'work'));
    }
    toast('ตั้งค่าเวรสำเร็จ');
  } else {
    toast('ลบเวรออกแล้ว');
  }
  save(); render();
}

function clearMonth(){
  var y=CUR.getFullYear(), m=CUR.getMonth(), last=new Date(y,m+1,0).getDate();
  for(var d=1; d<=last; d++){
    var key=ymd(new Date(y,m,d));
    DB.assign[key]={M:[],A:[],N:[]};
    delete DB.roles[key];
    delete DB.otype[key];
  }
  save(); toast('ล้างตารางเดือนนี้แล้ว'); render();
}
function parseCell(v){
  if(v===null||v===undefined) return [];
  var s=(''+v).trim(), out=[];
  var su=s.toUpperCase();
  if(!s||s==='-'||s==='0') return [];
  if(su.indexOf('ช')>=0||su.indexOf('M')>=0||su.indexOf('เช้า')>=0) out.push('M');
  if(su.indexOf('บ')>=0||su.indexOf('A')>=0||su.indexOf('บ่าย')>=0) out.push('A');
  if(su.indexOf('ด')>=0||su.indexOf('N')>=0||su.indexOf('ดึก')>=0) out.push('N');
  if(s==='Vac'||s==='น'||s==='อ') out.push('M');
  return (out.length ? out : ['M']);
}
function importSchedule(){
  var f=document.getElementById('xlsFile');
  if(!f||!f.files.length){ toast('เลือกไฟล์ก่อน',true); return; }
  var r=new FileReader();
  r.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      var sh=wb.Sheets[wb.SheetNames[0]];
      var js=XLSX.utils.sheet_to_json(sh,{header:1,defval:''});
      var hdr=-1, map={};
      for(var i=0;i<js.length && i<15;i++){
        var cnt=0, mm={};
        for(var c=1;c<js[i].length;c++){
          var v=(''+js[i][c]).trim();
          if(/^\d{1,2}$/.test(v)){ var dnum=+v; if(dnum>=1&&dnum<=31){ mm[c]=dnum; cnt++; } }
        }
        if(cnt>=5){ hdr=i; map=mm; break; }
      }
      if(hdr<0){ toast('ไม่พบแถวหัวตารางวันที่',true); return; }
      var y=CUR.getFullYear(), m=CUR.getMonth(), last=new Date(y,m+1,0).getDate();
      for(var d=1; d<=last; d++){ var k=ymd(new Date(y,m,d)); DB.assign[k]={M:[],A:[],N:[]}; }
      var added=0, newPeople=0, mx=0;
      var allCaps=POS.map(function(p){ return p.c; });
      for(var q=0;q<DB.staff.length;q++) if(DB.staff[q].id>mx) mx=DB.staff[q].id;
      for(var row=hdr+1; row<js.length; row++){
        var nm=(''+(js[row][0]||'')).trim();
        if(!nm) continue;
        var sid=null;
        for(var w=0;w<DB.staff.length;w++) if(DB.staff[w].name===nm) sid=DB.staff[w].id;
        if(!sid){ mx++; sid=mx; DB.staff.push({id:sid,name:nm,level:'RN',caps:allCaps}); newPeople++; }
        for(var col in map){
          var dnum2=map[col];
          if(dnum2>last) continue;
          var cellVal=(''+js[row][col]).trim();
          var codes=parseCell(cellVal);
          if(!codes.length) continue;
          var key2=ymd(new Date(y,m,dnum2));
          for(var z=0;z<codes.length;z++){
            var sc=codes[z];
            if(DB.assign[key2][sc].indexOf(sid)<0){
              DB.assign[key2][sc].push(sid);
              added++;
              if(cellVal==='Vac'||cellVal==='น'||cellVal==='อ'){
                if(!DB.roles[key2]) DB.roles[key2]={};
                if(!DB.roles[key2][sc]) DB.roles[key2][sc]={};
                DB.roles[key2][sc][sid]=cellVal;
              }
            }
          }
        }
      }
      save(); drawWho(); render();
      var el=document.getElementById('impLog');
      if(el) el.textContent='นำเข้าสำเร็จ · เพิ่มเวร '+added+' รายการ · พบชื่อใหม่ '+newPeople+' คน';
      toast('นำเข้าตารางสำเร็จ '+added+' เวร');
    }catch(err){ toast('อ่านไฟล์ไม่สำเร็จ ตรวจรูปแบบไฟล์',true); }
  };
  r.readAsArrayBuffer(f.files[0]);
}

    '<select id="sw_s" class="w-full border border-pink-200 rounded-xl px-3 py-2 text-sm mb-3">'+o3+'</select>'+
    '<button onclick="doSwap()" class="bg-pink-600 text-white px-4 py-2 rounded-xl text-sm font-semibold w-full">สลับเวรทันที</button></div>'+
    '<div class="border border-violet-200 bg-violet-50/50 rounded-2xl p-4">'+
    '<h3 class="font-bold text-violet-700 mb-2">🎁 ยก OT ให้เพื่อน</h3>'+
    '<p class="text-[11px] text-slate-500 mb-2">เวรของฉันจะถูกถอดออก และเพื่อนจะได้เวรนี้เพิ่มโดยนับเป็น OT</p>'+
    '<label class="text-xs font-semibold">เวรที่จะยกให้</label>'+
    '<select id="gv_my" class="w-full border border-violet-200 rounded-xl px-3 py-2 text-sm mb-2">'+o1+'</select>'+
    '<label class="text-xs font-semibold">ยกให้</label>'+
    '<select id="gv_to" class="w-full border border-violet-200 rounded-xl px-3 py-2 text-sm mb-3">'+o2+'</select>'+
    '<button onclick="doGive()" class="bg-violet-600 text-white px-4 py-2 rounded-xl text-sm font-semibold w-full">ยก OT ให้ทันที</button></div></div>'+
    '<h3 class="font-semibold text-pink-800 text-sm mt-5 mb-1">🧾 ประวัติการแลกล่าสุด</h3>'+
    (logs||'<p class="text-xs text-slate-400">ยังไม่มีประวัติ</p>');
}
function doSwap(){
  var v=document.getElementById('sw_my').value;
  if(!v){ toast('ไม่มีเวรให้แลก',true); return; }
  var a=v.split('|'), ad=a[0], asc=a[1];
  var to=+document.getElementById('sw_to').value;
  var bd=document.getElementById('sw_d').value, bsc=document.getElementById('sw_s').value;
  if(!bd){ toast('เลือกวันเวรของอีกฝ่ายก่อน',true); return; }
  var B=listOf(bd,bsc);
  if(B.indexOf(to)<0){ toast(nameOf(to)+' ไม่มีเวรในวัน/ผลัดที่เลือก',true); return; }
  if(ad===bd && asc===bsc){ toast('เป็นเวรเดียวกัน',true); return; }
  if(listOf(bd,bsc).indexOf(ME)>=0 || listOf(ad,asc).indexOf(to)>=0){ toast('สลับแล้วจะมีเวรซ้อนกัน',true); return; }
  var A=DB.assign[ad][asc];
  A[A.indexOf(ME)]=to;
  B[B.indexOf(to)]=ME;
  if(DB.roles[ad]&&DB.roles[ad][asc]) delete DB.roles[ad][asc][ME];
  if(DB.roles[bd]&&DB.roles[bd][bsc]) delete DB.roles[bd][bsc][to];
  DB.logs.push('⇄ '+nameOf(ME)+' ('+thDate(ad)+' '+shOf(asc).l+') สลับกับ '+nameOf(to)+' ('+thDate(bd)+' '+shOf(bsc).l+')');
  save(); toast('สลับเวรเรียบร้อย ตารางอัปเดตแล้ว'); render();
}
function doGive(){
  var v=document.getElementById('gv_my').value;
  if(!v){ toast('ไม่มีเวรให้ยก',true); return; }
  var a=v.split('|'), d=a[0], sc=a[1];
  var to=+document.getElementById('gv_to').value;
  var A=DB.assign[d][sc];
  if(A.indexOf(to)>=0){ toast(nameOf(to)+' มีเวรผลัดนี้อยู่แล้ว',true); return; }
  A[A.indexOf(ME)]=to;
  if(DB.roles[d]&&DB.roles[d][sc]) delete DB.roles[d][sc][ME];
  if(!DB.otype[d]) DB.otype[d]={};
  if(!DB.otype[d][sc]) DB.otype[d][sc]={};
  DB.otype[d][sc][to]='ot';
  DB.logs.push('🎁 '+nameOf(ME)+' ยก OT '+thDate(d)+' '+shOf(sc).l+' ให้ '+nameOf(to));
  save(); toast('ยก OT ให้ '+nameOf(to)+' เรียบร้อย'); render();
}

function toggleCap(id,code){
  for(var i=0;i<DB.staff.length;i++){

    var k=c.indexOf(code);

    DB.staff[i].caps=c;

  save(); render();
}
function updName(id,v){ for(var i=0;i<DB.staff.length;i++) if(DB.staff[i].id===id) DB.staff[i].name=v.trim(); save(); drawWho(); toast('แก้ชื่อแล้ว'); }
function updLevel(id,v){ for(var i=0;i<DB.staff.length;i++) if(DB.staff[i].id===id) DB.staff[i].level=v; save(); }
function addNewStaff(){
  var n=document.getElementById('nName').value.trim();
  if(!n){ toast('กรอกชื่อก่อน',true); return; }
  var lv=document.getElementById('nLevel').value;
  var boxes=document.getElementsByClassName('newcap'), caps=[];
  for(var i=0;i<boxes.length;i++) if(boxes[i].checked) caps.push(boxes[i].value);
  var mx=0;
  for(var j=0;j<DB.staff.length;j++) if(DB.staff[j].id>mx) mx=DB.staff[j].id;
  DB.staff.push({id:mx+1,name:n,level:lv,caps:caps});
  save(); drawWho(); toast('เพิ่ม '+n+' แล้ว'); render();
}
function delStaff(id){
  DB.staff=DB.staff.filter(function(s){ return s.id!==id; });
  var keys=Object.keys(DB.assign);
  for(var k=0;k<keys.length;k++)
    for(var s=0;s<SHIFT.length;s++){
      var ar=DB.assign[keys[k]][SHIFT[s].c];
      if(ar) DB.assign[keys[k]][SHIFT[s].c]=ar.filter(function(x){ return x!==id; });
    }
  if(ME===id) ME=DB.staff.length?DB.staff[0].id:null;
  VIEWID=ME;
  save(); drawWho(); toast('ลบรายชื่อแล้ว'); render();
}

document.getElementById('pin').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
